<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Study Notes</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Git Study Notes</h1>
    <p>Git 공부 내용을 담은 Markdown 원본 파일을 내려받을 수 있습니다.</p>

    <section class="download-card" aria-labelledby="file-title">
      <h2 id="file-title">git-study-notes.md</h2>
      <dl>
        <div><dt>버전</dt><dd id="version">확인 중…</dd></div>
        <div><dt>마지막 수정</dt><dd id="last-modified">확인 중…</dd></div>
      </dl>
      <button id="download-button" type="button">Markdown 다운로드</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
